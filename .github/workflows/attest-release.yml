# ABOUTME: Attests the three installation files of a published GitHub release.
# ABOUTME: Releases are created by make release; this workflow only verifies and signs.
name: Attest release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release version (x.y.z)
        required: true
        type: string

permissions: {}

concurrency:
  group: attest-release
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release files before signing
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tag must be an x.y.z version.' >&2
            exit 2
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          jq -e --arg version "$RELEASE_TAG" '.version == $version' manifest.json
          gh release view "$RELEASE_TAG" --json isDraft,assets |
            jq -e '.isDraft == false and
              ([.assets[].name] | sort) == ["main.js", "manifest.json", "styles.css"]'
          release_assets=$(mktemp -d)
          gh release download "$RELEASE_TAG" --dir "$release_assets" \
            --pattern main.js --pattern manifest.json --pattern styles.css
          for asset in main.js manifest.json styles.css; do
            git show "refs/tags/$RELEASE_TAG:$asset" > "$release_assets/tagged-$asset"
            cmp "$asset" "$release_assets/tagged-$asset"
            cmp "$asset" "$release_assets/$asset"
          done
          # The disposable GitHub-hosted runner owns temporary-file cleanup.
      - name: Attest the verified installation files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
          create-storage-record: false
